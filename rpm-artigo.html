<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <title>RPM | ART</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Space Grotesk", system-ui, sans-serif;
      --panel: rgba(255, 255, 255, 0.05);
      --panel-strong: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a1ffeb;
      --muted: rgba(255, 255, 255, 0.75);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #050714 0%, #131a2d 60%, #1f1f35 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    #page-shell {
      width: min(1100px, 100%);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 28px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .hero small {
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    .pill {
      display: inline-flex;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(99, 245, 201, 0.12);
      color: var(--accent);
      font-size: 0.85rem;
    }

    .panel {
      background: var(--panel-strong);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .tear-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .tear-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 14px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tear-row p {
      color: var(--accent);
      letter-spacing: 0.1em;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.035);
      color: #fff;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 245, 201, 0.3);
    }

    .nav-row {
      display: flex;
      justify-content: center;
    }

    .nav-row a {
      padding: 12px 20px;
      background: #101529;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-row a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="page-shell">
    <header class="hero">
      <span class="pill">RPM + ART</span>
      <h1>RPM | ART</h1>
      <small>Registre RPM e Artigos para cada tear e volte quando quiser.</small>
    </header>

    <section class="panel">
      <form class="tear-grid">
        <template id="tear-template">
          <div class="tear-row">
            <p>TEAR XX</p>
            <input placeholder="RPM" />
            <input placeholder="ART" />
          </div>
        </template>
      </form>
    </section>

    <div class="nav-row">
      <a href="./index2.html" onclick="save()">HOME</a>
    </div>
  </div>

  <script>
    const form = document.querySelector('.tear-grid');
    const template = document.getElementById('tear-template');
    const tearLabels = Array.from({ length: 12 }, (_, index) => ({
      label: `TEAR ${String(index + 1).padStart(2, '0')}`
    }));

    tearLabels.forEach((item) => {
      const clone = template.content.cloneNode(true);
      clone.querySelector('p').textContent = item.label;
      form.appendChild(clone);
    });

    const get = document.querySelectorAll('input');
    const rpm = [];
    const art = [];

    for (let i = 0; i < get.length; i += 2) {
      rpm.push(get[i]);
      art.push(get[i + 1]);
    }

    let grupo = localStorage.getItem('grupo');
    const desc = document.querySelectorAll('.tear-row>p');

    const ranges = [
      ['01', '12'],
      ['13', '24'],
      ['25', '36'],
      ['37', '48'],
      ['49', '60'],
      ['61', '72'],
      ['73', '84'],
      ['85', '96']
    ];

    if (grupo) {
      const base = parseInt(grupo, 10) - 1;
      const [start, end] = ranges[base] || ranges[0];
      let current = parseInt(start, 10);
      desc.forEach((element, idx) => {
        element.textContent = `TEAR ${String(current).padStart(2, '0')}`;
        current += 1;
      });
    }

    const save = () => {
      const saveIN = (key, value) => {
        localStorage.setItem(key, value);
      };

      rpm.forEach((input, index) => {
        saveIN(`rpm${index}`, input.value);
        saveIN(`art${index}`, art[index].value);
      });
    };

    rpm.forEach((input, index) => {
      input.value = localStorage.getItem(`rpm${index}`) || '';
      art[index].value = localStorage.getItem(`art${index}`) || '';
    });
  </script>
</body>
