<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <meta name="theme-color" content="#a1ffeb">
  <meta name="description" content="App de coleta de dados de teste de ruptura">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TesteRuptura">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="tecelagem.png" type="image/x-icon" />
  <link rel="apple-touch-icon" href="tecelagem.png">
  <link rel="shortcut icon" href="tecelagem.png" type="image/x-icon" />
  <script src="libs/chart.js/Chart.min.js"></script>
  <title>devkleisom - home</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --bg: #050714;
      --panel: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a1ffeb;
      --accent-strong: #63f5c9;
      --muted: rgba(255, 255, 255, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(180deg, #050714 0%, #131a2d 60%, #1f1f35 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    #page-shell {
      width: min(1100px, 100%);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.45);
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .hero small {
      color: var(--muted);
      display: block;
      margin-bottom: 14px;
    }

    .hero-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(99, 245, 201, 0.12);
      font-size: 0.85rem;
      color: var(--accent);
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    label {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-weight: 500;
      transition: border-color 0.2s ease;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: var(--accent-strong);
      box-shadow: 0 0 0 2px rgba(99, 245, 201, 0.3);
    }

    .button-row {
      margin-top: 8px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button-row a,
    #btn-graficos button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: #101529;
      color: var(--accent-strong);
      padding: 12px 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .button-row a:hover,
    #btn-graficos button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    #btn-graficos {
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chart-card h3 {
      margin-bottom: 12px;
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 14px 0 30px;
    }

    #console {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.9rem;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }

      .hero,
      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="page-shell">
    <header class="hero">
      <p class="pill">UTI - Teste de ruptura</p>
      <h1>Teste de ruptura v1.0.3</h1>
      <small>Registre valores para o período, grupo e total antes de seguir para os próximos passos.</small>
      <div class="hero-summary">
        <span class="pill">Grupos ativaizados</span>
        <span class="pill">Sem dados salvos</span>
      </div>
    </header>

    <section class="panel">
      <form class="formInicio">
        <div>
          <label for="start">INÍCIO</label>
          <input type="text" id="start" name="start" placeholder="Ex: 08:00" />
        </div>
        <div>
          <label for="end">FIM</label>
          <input type="text" id="end" name="end" placeholder="Ex: 16:00" />
        </div>
        <div>
          <label for="nGroup">Nº DO GRUPO</label>
          <select id="nGroup" name="nGroup">
            <option value="">Escolha um grupo</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </div>
        <div>
          <label for="total">T/TOTAL</label>
          <input type="number" id="total" name="total" placeholder="0" />
        </div>
      </form>
      <div class="button-row nav-grid" aria-label="Ações principais">
        <a href="./inicio-fim.html" onclick="saveInitial(); window.location.href = './inicio-fim.html'; return false;">PONTOS INICIAIS</a>
        <a href="./inicio-fim.html" onclick="saveInitial(); window.location.href = './inicio-fim.html'; return false;">PONTOS FINAIS</a>
        <a href="rpm-artigo.html" onclick="saveInitial(); window.location.href = './rpm-artigo.html'; return false;">INSERIR ARTIGOS</a>
        <a href="#" onclick="saveInitial(); return false;">INSERIR RPM</a>
        <a href="./teares.html" onclick="saveInitial()">INICIAR</a>
        <a href="./relatorio01.html" onclick="saveInitial()">REL01</a>
        <a href="./relatorio02.html" onclick="saveInitial()">REL02</a>
        <a id="limpa-storage" href="#">CLEAR</a>
      </div>
    </section>

    <section class="panel">
      <div class="button-row" id="btn-graficos" role="group" aria-label="Selecionar gráfico">
        <button type="button">URDUME</button>
        <button type="button">TRAMA</button>
      </div>
      <div class="charts">
        <div class="chart-card">
          <h3>URDUME</h3>
          <canvas id="myChart" style="width:100%"></canvas>
        </div>
        <div class="chart-card">
          <h3>TRAMA</h3>
          <canvas id="myChart2" style="width:100%"></canvas>
        </div>
      </div>
      <div id="console"></div>
      
    </section>

    <footer>devKledisom - © 2026</footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(() => {
        console.log('Service Worker registrado com sucesso');
      }).catch((error) => {
        console.log('Falha ao registrar Service Worker:', error);
      });
    }
  </script>
  <script>
    const btnsGrafico = document.querySelectorAll('#btn-graficos>button');
    const chartCard01 = document.querySelectorAll('.chart-card')[0];
    const chartCard02 = document.querySelectorAll('.chart-card')[1];

    chartCard01.style.display = 'flex';
    chartCard02.style.display = 'none';

    btnsGrafico[0].addEventListener('click', () => {
      chartCard02.style.display = 'none';
      chartCard01.style.display = 'flex';
    });

    btnsGrafico[1].addEventListener('click', () => {
      chartCard01.style.display = 'none';
      chartCard02.style.display = 'flex';
    });

    const start = document.getElementById('start');
    const end = document.getElementById('end');
    const nGroup = document.getElementById('nGroup');
    const total = document.getElementById('total');

    nGroup.value = localStorage.getItem('grupo') || '';

    function saveInitial() {
      localStorage.setItem('inicio', start.value);
      localStorage.setItem('fim', end.value);
      localStorage.setItem('grupo', nGroup.value);
      localStorage.setItem('total', total.value);
    }

    document.getElementById('start').value = localStorage.getItem('inicio') || '';
    document.getElementById('end').value = localStorage.getItem('fim') || '';
    document.getElementById('total').value = localStorage.getItem('total') || '';

    document.getElementById('limpa-storage').onclick = function () {
      const result = confirm('Deseja apagar os dados do teste anterior?');
      if (result) {
        localStorage.clear();
        location.reload();
      }
    };

    const dados = Array.from({ length: 12 }, (_, baseIndex) => {
      const index = baseIndex + 1;
      return {
        fioColado: parseInt(localStorage.getItem(`tear 0${index} fio-colado`) || '0', 10),
        ponta: parseInt(localStorage.getItem(`tear 0${index} ponta`) || '0', 10),
        rolo: parseInt(localStorage.getItem(`tear 0${index} roloEmb`) || '0', 10),
        fioLd: parseInt(localStorage.getItem(`tear 0${index} fio-fioLd`) || '0', 10),
        fioLe: parseInt(localStorage.getItem(`tear 0${index} fio-fioLe`) || '0', 10),
        fioMeio: parseInt(localStorage.getItem(`tear 0${index} fio-fioMeio`) || '0', 10),
        carritel: parseInt(localStorage.getItem(`tear 0${index} carritel`) || '0', 10),
        fioBam: parseInt(localStorage.getItem(`tear 0${index} fioBam`) || '0', 10),
        slub: parseInt(localStorage.getItem(`tear 0${index} slub`) || '0', 10),
        bucha: parseInt(localStorage.getItem(`tear 0${index} bucha`) || '0', 10),
        outros: parseInt(localStorage.getItem(`tear 0${index} outros`) || '0', 10),
        fioGro: parseInt(localStorage.getItem(`tear 0${index} fioGro`) || '0', 10)
      };
    });

    const dado1 = dados.reduce((sum, item) => sum + item.fioColado, 0);
    const dado2 = dados.reduce((sum, item) => sum + item.ponta, 0);
    const dado3 = dados.reduce((sum, item) => sum + item.rolo, 0);
    const dado4 = dados.reduce((sum, item) => sum + item.fioLd, 0);
    const dado5 = dados.reduce((sum, item) => sum + item.fioLe, 0);
    const dado6 = dados.reduce((sum, item) => sum + item.fioMeio, 0);
    const dado7 = dados.reduce((sum, item) => sum + item.carritel, 0);
    const dado8 = dados.reduce((sum, item) => sum + item.fioBam, 0);
    const dado9 = dados.reduce((sum, item) => sum + item.slub, 0);
    const dado10 = dados.reduce((sum, item) => sum + item.bucha, 0);
    const dado11 = dados.reduce((sum, item) => sum + item.outros, 0);
    const dado12 = dados.reduce((sum, item) => sum + item.fioGro, 0);

    localStorage.setItem(
      'graficoUrd',
      JSON.stringify([
        dado1,
        dado2,
        dado3,
        dado4,
        dado5,
        dado6,
        dado7,
        dado8,
        dado9,
        dado10,
        dado11,
        dado12
      ])
    );

    const xValues = [
      'Fio Colado',
      'ponta de fio',
      'Rolo embaraçado',
      'fio fraco L/D',
      'fio fraco L/E',
      'fio fraco meio',
      'carritel',
      'fio bambo',
      'slub',
      'bucha',
      'outros',
      'fio grosso'
    ];

    const quebras = JSON.parse(localStorage.getItem('graficoUrd')) || Array(12).fill(0);
    document.querySelector('#console').innerHTML = quebras.join(', ');
    const yValues = quebras.slice(0, 12);
    const barColors = [
      '#b91d47',
      '#00aba9',
      '#2b5797',
      '#e8c3b9',
      '#1e7145',
      'yellow',
      'purple',
      'brown',
      'orange',
      'red',
      'lime',
      '#00FFFF'
    ];

    new Chart('myChart', {
      type: 'bar',
      data: {
        labels: xValues,
        datasets: [
          {
            backgroundColor: barColors,
            data: yValues
          }
        ]
      },
      options: {
        title: {
          display: true,
          text: 'URDUME'
        },
        legend: { display: false }
      }
    });

    const xValues2 = [
      'nó na trama',
      'trama fraca',
      'defeito bobina',
      'conical vazio',
      'quebra trama cala',
      'pré-alimentador A',
      'pré-alimentador B',
      'slub',
      'voltando trama',
      'outros'
    ];
    const yValues2 = [55, 49, 44, 24, 15, 10, 10, 10, 10, 10];
    const barColors2 = [
      '#b91d47',
      '#00aba9',
      '#2b5797',
      '#e8c3b9',
      '#1e7145',
      'yellow',
      'purple',
      'brown',
      'orange',
      'red',
      'lime'
    ];

    new Chart('myChart2', {
      type: 'bar',
      data: {
        labels: xValues2,
        datasets: [
          {
            backgroundColor: barColors2,
            data: yValues2
          }
        ]
      },
      options: {
        title: {
          display: true,
          text: 'TRAMA'
        },
        legend: { display: false }
      }
    });
  </script>
</body>
</html>
