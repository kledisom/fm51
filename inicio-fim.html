<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <title>Pontos Iniciais e Finais</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Space Grotesk", system-ui, sans-serif;
      --panel: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a1ffeb;
      --muted: rgba(255, 255, 255, 0.75);
      --panel-strong: rgba(255, 255, 255, 0.03);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #050714 0%, #131a2d 60%, #1f1f35 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    #page-shell {
      width: min(1100px, 100%);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45);
    }

    .hero h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .hero small {
      color: var(--muted);
      display: block;
      margin-bottom: 14px;
    }

    .pill {
      display: inline-flex;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(99, 245, 201, 0.12);
      color: var(--accent);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .panel {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
    }

    .tear-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .tear-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .tear-row p {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-weight: 500;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 245, 201, 0.3);
    }

    .nav-row {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .nav-row a {
      padding: 12px 20px;
      background: #101529;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--accent);
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-row a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
